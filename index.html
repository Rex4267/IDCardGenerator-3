<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ID Card Generator</title>
<style>
    body { font-family: Arial, sans-serif; margin: 20px; background: #f4f4f4; }
    h2 { text-align: center; }
    .container { display: flex; flex-wrap: wrap; justify-content: center; gap: 20px; }
    .form-section { width: 300px; background: #fff; padding: 15px; border-radius: 8px; box-shadow: 0 0 10px rgba(0,0,0,0.1); }
    flex-direction: column; gap: 20px; }
    canvas { border: 1px solid #ccc; }
    input[type="text"], input[type="file"] { width: 100%; margin-bottom: 10px; padding: 8px; }
    button { width: 100%; padding: 10px; margin-top: 5px; background: #C2185B; color: #fff; border: none; cursor: pointer; font-size: 16px; }
    button:hover { background: #a3154a; }
</style>
</head>
<body>

<h2>Symphony Formulations ID Card Generator</h2>
<div class="container">
    <div class="form-section">
        <h3>Enter Details</h3>
        <input type="text" id="name" placeholder="Name">
        <input type="text" id="empCode" placeholder="Emp Code">
        <input type="text" id="bloodGroup" placeholder="Blood Group">
        <input type="text" id="emergencyNo" placeholder="Emergency No">
        <input type="file" id="photoUpload" accept="image/*">
        <button onclick="previewID()">Preview</button>
        <button onclick="downloadZIP()">Download ZIP</button>
    </div>

    <div class="preview-section">
        <h3>Front Preview</h3>
        <canvas id="frontCanvas" width="480" height="750"></canvas>
        <h3>Back Preview</h3>
        <canvas id="backCanvas" width="480" height="750"></canvas>
    </div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
<script>
const frontCanvas = document.getElementById('frontCanvas');
const backCanvas = document.getElementById('backCanvas');
const frontCtx = frontCanvas.getContext('2d');
const backCtx = backCanvas.getContext('2d');

const frontImg = new Image();
const backImg = new Image();
frontImg.src = 'front.jpg'; // Rename your image
backImg.src = 'back.jpg';   // Rename your image

let uploadedPhoto = null;

document.getElementById('photoUpload').addEventListener('change', function(e) {
    const reader = new FileReader();
    reader.onload = function(event) {
        uploadedPhoto = new Image();
        uploadedPhoto.src = event.target.result;
    };
    reader.readAsDataURL(e.target.files[0]);
});

function previewID() {
    const name = document.getElementById('name').value;
    const empCode = document.getElementById('empCode').value;
    const bloodGroup = document.getElementById('bloodGroup').value;
    const emergencyNo = document.getElementById('emergencyNo').value;

    // Draw Front
    frontCtx.clearRect(0, 0, frontCanvas.width, frontCanvas.height);
    frontCtx.drawImage(frontImg, 0, 0, frontCanvas.width, frontCanvas.height);

    if (uploadedPhoto) {
        frontCtx.drawImage(uploadedPhoto, 140, 250, 200, 250); // Photo position
    }

    frontCtx.font = 'bold 28px Arial';
    frontCtx.fillStyle = '#C2185B';
    frontCtx.textAlign = 'center';
    frontCtx.fillText(name, frontCanvas.width / 2, 530);

    frontCtx.font = '20px Arial';
    frontCtx.fillStyle = '#000';
    frontCtx.fillText('Emp code: ' + empCode, frontCanvas.width / 2, 570);

    // Draw Back
    backCtx.clearRect(0, 0, backCanvas.width, backCanvas.height);
    backCtx.drawImage(backImg, 0, 0, backCanvas.width, backCanvas.height);

    backCtx.font = '20px Arial';
    backCtx.fillStyle = '#000';
    backCtx.textAlign = 'left';
    backCtx.fillText(bloodGroup, 180, 640);
    backCtx.fillText(emergencyNo, 180, 670);
}

function downloadZIP() {
    const zip = new JSZip();
    zip.file('ID_Front.png', frontCanvas.toDataURL().split(',')[1], {base64: true});
    zip.file('ID_Back.png', backCanvas.toDataURL().split(',')[1], {base64: true});

    zip.generateAsync({type: 'blob'}).then(function(content) {
        const link = document.createElement('a');
        link.href = URL.createObjectURL(content);
        link.download = 'ID_Card.zip';
        link.click();
    });
}
</
